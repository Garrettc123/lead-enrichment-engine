name: Vault Secrets (Lead Enrichment)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require VAULT_ADDR
        run: |
          if [ -z "${{ env.VAULT_ADDR }}" ]; then
            echo "::error::Set VAULT_ADDR"
            exit 1
          fi

      - name: Import from Vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/enrichment * ;
            secret/data/garcar/apollo * ;
            secret/data/garcar/hubspot * ;
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;

      - name: Verify
        run: |
          for var in CLEARBIT_API_KEY HUNTER_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "::warning::$var empty (write it to Vault)"
            else
              echo "✅ $var"
            fi
          done
